name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated pytest suite
        run: |
          python -m pytest tests/ -v

      - name: Run smoke test pipeline with sample data
        run: |
          python run.py --input examples/sample_ev_data.xlsx --output-dir outputs/ --yes

      - name: Verify generated artifacts
        run: |
          python harness/test_harness.py --sub-datasets outputs/sub_datasets.json --insights outputs/insights.json
